apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz-platform-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "quiz-backend-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - host: cognition-gim.enterprise.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quiz-frontend-service
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: quiz-backend-service
            port:
              number: 4000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: quiz-backend-service
            port:
              number: 4000

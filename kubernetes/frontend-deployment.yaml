apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-frontend
  labels:
    app: quiz-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quiz-frontend
  template:
    metadata:
      labels:
        app: quiz-frontend
    spec:
      containers:
      - name: frontend
        image: yourcontainerregistry/quiz-frontend:latest
        ports:
        - containerPort: 3000
          name: webport
        resources:
          limits:
            cpu: "1"
            memory: 1.5Gi
          requests:
            cpu: "500m"
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-frontend-service
spec:
  selector:
    app: quiz-frontend
  ports:
  - port: 3000
    targetPort: 3000

config:
  target: "http://localhost:4000"

  phases:
    - name: "Ramp to 700 Players"
      duration: 60
      arrivalRate: 12

    - name: "Hold 700 Players"
      duration: 300
      arrivalRate: 12

  engines:
    socketio:
      transports: ["websocket", "polling"]
      path: "/socket.io"

scenarios:
  - name: "Join Quiz"
    engine: socketio

    flow:
      - connect: {}

      - emit:
          channel: "player:join"
          data:
            pin: "999999"
            name: "Player{{ $randomString() }}"

      - think: 300
name: Enterprise Quiz Platform CI/CD Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Lint, Audit and Test Suite Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-level: "20"
          cache: "npm"

      # Backend Tasks
      - name: Install Backend Packages
        run: npm ci
        cwd: ./backend

      - name: Generate Prisma Types
        run: npx prisma generate
        cwd: ./backend

      - name: Compile Backend TypeScript
        run: npm run build
        cwd: ./backend

      # Frontend Tasks
      - name: Install Frontend Packages
        run: npm ci --legacy-peer-deps
        cwd: ./frontend

      - name: Compile Frontend NextJS Build
        run: npm run build
        cwd: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker-and-deploy:
    name: Compile Docker Images & Kubernetes Push
    needs: audit-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Configure Kubectl Connection
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Manifests to Kubernetes Cluster
        run: |
          kubectl apply -f kubernetes/postgres-deployment.yaml
          kubectl apply -f kubernetes/redis-deployment.yaml
          kubectl apply -f kubernetes/backend-deployment.yaml
          kubectl apply -f kubernetes/frontend-deployment.yaml
          kubectl apply -f kubernetes/ingress.yaml
          kubectl rollout status deployment/quiz-backend
          kubectl rollout status deployment/quiz-frontend
